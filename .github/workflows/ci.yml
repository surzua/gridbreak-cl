name: CI - Quality & Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check code formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with mypy (strict)
        run: uv run mypy src tests

      - name: Run unit test suite with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Validate CLI offline execution
        run: uv run gridbreak-cl ingest-live --offline

      - name: Validate portfolio figures generation
        run: uv run python -c "from gridbreak_cl.visualization.static_charts import generate_all_portfolio_figures; generate_all_portfolio_figures()"
